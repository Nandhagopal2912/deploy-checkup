[build-system]
requires =["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-checkup"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "httpx >= 0.28,<1",
    "rich >= 14,<16",
]

[project.optional-dependencies]
dev = [
    "pytest >=8",
]

[project.scripts]
deploy-checkup = "deploy_checkup.cli:main"

