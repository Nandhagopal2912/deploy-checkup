name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0

      - name: Check the release tag matches the version in pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          echo "Tag: $TAG  pyproject.toml: $version"
          test "$TAG" = "v$version"

      - run: uv sync --locked
      - run: uv run pytest

      - run: uv build
      - run: uv run twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
